version: '3.8'

# ============================================================================
# Production Docker Compose Configuration
# - Frontend: Optimized NGINX build
# - No hot reload (better performance)
# - Suitable for production deployment
# ============================================================================

services:
  # MinIO Object Storage (对象存储)
  minio:
    image: swr.cn-north-4.myhuaweicloud.com/ddn-k8s/docker.io/minio/minio:latest
    container_name: hr-minio
    ports:
      - "9000:9000"   # API端口
      - "9001:9001"   # Console端口 (Web UI)
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER:-minioadmin}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD:-minioadmin123}
      - MINIO_DEFAULT_BUCKETS=cv-uploads:public
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
    networks:
      - hr-network
    restart: unless-stopped

  # MongoDB 数据库
  mongodb:
    image: swr.cn-north-4.myhuaweicloud.com/ddn-k8s/docker.io/mongo:latest
    container_name: hr-mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    environment:
      - MONGO_INITDB_DATABASE=ai-hr-automation
    networks:
      - hr-network
    restart: unless-stopped

  # PostgreSQL 数据库 (用户认证)
  postgres:
    image: swr.cn-north-4.myhuaweicloud.com/ddn-k8s/docker.io/library/postgres:16-alpine
    container_name: hr-postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-postgres.sh:/docker-entrypoint-initdb.d/init-postgres.sh:ro
    environment:
      - POSTGRES_USER=${POSTGRES_ADMIN_USER:-hr_admin}
      - POSTGRES_PASSWORD=${POSTGRES_ADMIN_PASSWORD:-hr_admin_pass}
      - POSTGRES_DB=${POSTGRES_ADMIN_DB:-postgres}
      - APP_DB_USER=${POSTGRES_USER:-hr_user}
      - APP_DB_PASSWORD=${POSTGRES_PASSWORD:-hr_pass}
      - APP_DB_NAME=${POSTGRES_DB:-hr_users}
    networks:
      - hr-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_ADMIN_USER:-hr_admin} -d ${POSTGRES_ADMIN_DB:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Qdrant 向量数据库 (语义检索)
  qdrant:
    image: swr.cn-north-4.myhuaweicloud.com/ddn-k8s/docker.io/qdrant/qdrant:latest
    container_name: hr-qdrant
    ports:
      - "6333:6333"   # REST API
      - "6334:6334"   # gRPC
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - hr-network
    restart: unless-stopped

  # Neo4j 知识图谱数据库 (实体关系检索)
  neo4j:
    image: swr.cn-north-4.myhuaweicloud.com/ddn-k8s/docker.io/library/neo4j:5-community
    container_name: hr-neo4j
    ports:
      - "7474:7474"   # Browser (Web UI)
      - "7687:7687"   # Bolt protocol
    environment:
      - NEO4J_AUTH=${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:-hr_neo4j_pass}
    volumes:
      - neo4j_data:/data
    networks:
      - hr-network
    restart: unless-stopped

  # HR Automation API
  hr-automation:
    build: .
    container_name: ai-hr-automation-api
    ports:
      - "8000:8000"
    environment:
      # LLM Provider
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - LLM_PROVIDER=${LLM_PROVIDER:-openai}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}

      # MinIO 存储配置
      - MINIO_ENDPOINT=${MINIO_ENDPOINT:-minio:9000}
      - MINIO_ACCESS_KEY=${MINIO_ACCESS_KEY:-minioadmin}
      - MINIO_SECRET_KEY=${MINIO_SECRET_KEY:-minioadmin123}
      - MINIO_BUCKET=${MINIO_BUCKET:-cv-uploads}
      - MINIO_SECURE=${MINIO_SECURE:-false}

      # MongoDB
      - MONGODB_URL=mongodb://mongodb:27017

      # PostgreSQL (用户认证)
      - POSTGRES_SERVER=${POSTGRES_SERVER:-postgres:5432}
      - POSTGRES_USER=${POSTGRES_USER:-hr_user}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-hr_pass}
      - POSTGRES_DB=${POSTGRES_DB:-hr_users}

      # Embedding (硅基流动 OpenAI 兼容 API)
      - EMBEDDING_PROVIDER=${EMBEDDING_PROVIDER:-siliconflow}
      - EMBEDDING_MODEL=${EMBEDDING_MODEL:-BAAI/bge-m3}
      - EMBEDDING_API_KEY=${EMBEDDING_API_KEY:-}
      - EMBEDDING_BASE_URL=${EMBEDDING_BASE_URL:-https://api.siliconflow.cn/v1}
      - EMBEDDING_DIM=${EMBEDDING_DIM:-1024}

      # Qdrant (向量检索)
      - QDRANT_URL=http://qdrant:6333
      - QDRANT_API_KEY=${QDRANT_API_KEY:-}

      # Neo4j (知识图谱)
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=${NEO4J_USER:-neo4j}
      - NEO4J_PASSWORD=${NEO4J_PASSWORD:-hr_neo4j_pass}

      # JWT 密钥 (生产环境请使用强随机密钥)
      - SECRET_KEY=${SECRET_KEY:-your-secret-key-change-in-production}
      - ALGORITHM=${ALGORITHM:-HS256}
      - ACCESS_TOKEN_EXPIRE_MINUTES=${ACCESS_TOKEN_EXPIRE_MINUTES:-30}

      # FastAPI
      - HOST=0.0.0.0
      - PORT=8000
      - WORKERS=4
      - DEBUG=false

    volumes:
      - ./logs:/app/logs
    depends_on:
      - minio
      - mongodb
      - postgres
      - qdrant
      - neo4j
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - hr-network

  # Frontend (React + Vite) - Production Mode with NGINX
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: hr-frontend
    ports:
      - "5173:80"
    environment:
      - VITE_API_URL=http://localhost:8000
    depends_on:
      - hr-automation
    restart: unless-stopped
    networks:
      - hr-network

volumes:
  minio_data:
    driver: local
  mongodb_data:
    driver: local
  postgres_data:
    driver: local
  qdrant_data:
    driver: local
  neo4j_data:
    driver: local

networks:
  hr-network:
    driver: bridge
